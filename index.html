<!-- gigigm version 1.0.1 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>gigigm</title>

    <style>
        :root {
            --bg: #f4f1ea;
            --bg-secondary: #ffffffcc;
            --text: #1f1f1f;
            --muted: #666;
            --border: rgba(0,0,0,0.08);
            --accent: #ff7a18;
            --shadow: rgba(0,0,0,0.08);
            --header-glow: rgba(255,122,24,0.15);
        }

        body.dark {
            --bg: #0f0f11;
            --bg-secondary: rgba(28,28,31,0.92);
            --text: #f4f4f4;
            --muted: #b0b0b0;
            --border: rgba(255,255,255,0.08);
            --accent: #ff9d4d;
            --shadow: rgba(0,0,0,0.35);
            --header-glow: rgba(255,157,77,0.15);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Inter, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, var(--header-glow), transparent 30%),
                var(--bg);
            color: var(--text);
            transition:
                background 0.25s ease,
                color 0.25s ease;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(2.2rem, 6vw, 4rem);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .brand p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 1rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle {
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .toggle:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }

        .card {
            overflow: hidden;
            border-radius: 26px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 14px 32px var(--shadow);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 18px 40px var(--shadow);
        }

        .card-image-wrap {
            overflow: hidden;
            aspect-ratio: 4 / 5;
            background: #00000010;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .card-content {
            padding: 18px;
        }

        .card-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 14px;
            word-break: break-word;
        }

        .card-date {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--muted);
            padding: 60px 20px;
        }

        footer {
            margin-top: 60px;
            padding: 28px 0 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 18px;
            }

            .gallery {
                gap: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>

        <div class="brand">
            <h1>gigigm</h1>
            <p>
                Daily GM/GN image stream from dergigi on Nostr.
            </p>
        </div>

        <div class="controls">
            <button class="toggle" id="themeToggle">
                🌙 Dark Mode
            </button>
        </div>

    </header>

    <main id="gallery" class="gallery">
        <div class="loading">
            Loading GM/GN posts...
        </div>
    </main>

    <footer>
        <div>
            Made with 🧡 by
            <a href="https://crrdlx.vercel.app" target="_blank">
                @crrdlx
            </a>
        </div>

        <div class="footer-links">
            <a
                href="https://github.com/crrdlx/gigigm"
                target="_blank"
            >
                Source code on GitHub
            </a>
        </div>
    </footer>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const HEX_PUBKEY =
        "6e468422dfb74a5738702a8823b9b28168abab8655faacb6853cd0ee15deee93";

    const RELAYS = [
        "wss://relay.primal.net",
        "wss://nos.lol",
        "wss://relay.damus.io"
    ];

    const IMAGE_REGEX =
        /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|avif))/gi;

    const galleryEl = document.getElementById("gallery");
    const themeToggle = document.getElementById("themeToggle");

    const displayedEvents = new Set();
    const displayedImages = new Set();

    // Dynamic background color extraction
    function applyDynamicBackground(imageUrl) {

        const img = new Image();
        img.crossOrigin = "Anonymous";

        img.onload = () => {

            try {

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                canvas.width = 50;
                canvas.height = 50;

                ctx.drawImage(img, 0, 0, 50, 50);

                const imageData = ctx.getImageData(0, 0, 50, 50).data;

                let r = 0;
                let g = 0;
                let b = 0;
                let count = 0;

                for (let i = 0; i < imageData.length; i += 4) {
                    r += imageData[i];
                    g += imageData[i + 1];
                    b += imageData[i + 2];
                    count++;
                }

                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);

                const glow = `rgba(${r}, ${g}, ${b}, 0.18)`;

                document.documentElement.style.setProperty(
                    "--header-glow",
                    glow
                );

            } catch (err) {
                console.error("Color extraction failed", err);
            }
        };

        img.src = imageUrl;
    }

    // Theme handling
    const savedTheme = localStorage.getItem("gigigm-theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.innerText = "☀️ Light Mode";
    }

    themeToggle.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        localStorage.setItem(
            "gigigm-theme",
            isDark ? "dark" : "light"
        );

        themeToggle.innerText = isDark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";
    });

    function formatDate(timestamp) {

        return new Date(timestamp * 1000).toLocaleString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function isGMGNPost(content) {

        const text = content.toLowerCase();

        return (
            /\bgm\b/.test(text) ||
            /\bgn\b/.test(text) ||
            /\bgood morning\b/.test(text) ||
            /\bgood night\b/.test(text) ||
            text.includes("🌅") ||
            text.includes("🌄") ||
            text.includes("🌌")
        );
    }

    function extractImages(event) {

        let images = [];

        const contentMatches = event.content.match(IMAGE_REGEX);

        if (contentMatches) {
            images.push(...contentMatches);
        }

        if (event.tags && Array.isArray(event.tags)) {

            event.tags.forEach(tag => {

                if (tag[0] === "imeta") {

                    tag.forEach(part => {

                        const match = part.match(
                            /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|avif))/i
                        );

                        if (match) {
                            images.push(match[1]);
                        }
                    });
                }

                if (
                    tag[0] === "image" &&
                    typeof tag[1] === "string"
                ) {
                    images.push(tag[1]);
                }

                if (
                    tag[0] === "r" &&
                    typeof tag[1] === "string"
                ) {

                    if (
                        /\.(png|jpg|jpeg|gif|webp|avif)$/i.test(tag[1])
                    ) {
                        images.push(tag[1]);
                    }
                }
            });
        }

        return [...new Set(images)];
    }

    function createCard(imgUrl, text, createdAt) {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="card-image-wrap">
                <a href="${imgUrl}" target="_blank">
                    <img
                        src="${imgUrl}"
                        alt="gigigm image"
                        loading="lazy"
                        onerror="this.src='https://placehold.co/600x800?text=Image+Failed'"
                    />
                </a>
            </div>

            <div class="card-content">
                <div class="card-text">
                    ${text}
                </div>

                <div class="card-date">
                    ${formatDate(createdAt)}
                </div>
            </div>
        `;

        galleryEl.appendChild(card);
    }

    function processEvent(event) {

        if (!event) return;

        if (displayedEvents.has(event.id)) {
            return;
        }

        displayedEvents.add(event.id);

        const content = event.content || "";

        if (!isGMGNPost(content)) {
            return;
        }

        const images = extractImages(event);

        if (!images.length) {
            return;
        }

        if (galleryEl.querySelector(".loading")) {
            galleryEl.innerHTML = "";
        }

        let cleanText = content
            .replace(IMAGE_REGEX, "")
            .trim();

        if (!cleanText) {
            cleanText = "🌅 GM";
        }

        images.forEach(img => {

            if (displayedImages.has(img)) {
                return;
            }

            displayedImages.add(img);

            if (displayedImages.size === 1) {
                try {
                    applyDynamicBackground(img);
                } catch (err) {
                    console.error("Background color sync failed", err);
                }
            }

            createCard(
                img,
                cleanText,
                event.created_at
            );
        });
    }

    RELAYS.forEach(relayUrl => {

        try {

            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {

                const subId =
                    "gigigm_" + Math.random().toString(36).slice(2);

                ws.send(JSON.stringify([
                    "REQ",
                    subId,
                    {
                        authors: [HEX_PUBKEY],
                        kinds: [1],
                        limit: 1000
                    }
                ]));
            };

            ws.onmessage = (e) => {

                try {

                    const data = JSON.parse(e.data);

                    if (data[0] === "EVENT") {
                        processEvent(data[2]);
                    }

                } catch (err) {
                    console.error(err);
                }
            };

            ws.onerror = (err) => {
                console.error("Relay error:", relayUrl, err);
            };

        } catch (err) {
            console.error("WebSocket failed:", relayUrl, err);
        }
    });

    setTimeout(() => {

        if (displayedImages.size === 0) {

            galleryEl.innerHTML = `
                <div class="loading">
                    No GM/GN image posts found.
                </div>
            `;
        }

    }, 10000);

});

</script>

</body>
</html>
